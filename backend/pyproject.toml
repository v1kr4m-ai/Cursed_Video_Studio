[project]
name = "cineflow"
version = "0.1.0"
description = "CineFlow AI backend: local-first automated video production engine"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cineflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["sample: needs the real Avata 360 footage (set CINEFLOW_SAMPLE_DIR)"]
